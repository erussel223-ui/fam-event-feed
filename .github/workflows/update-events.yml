name: Update FAM Event Feed

on:
  # Allows us to test the collector manually from GitHub.
  workflow_dispatch:

  # Automatically refresh the event feed every 6 hours.
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FAM event collector
        run: |
          python collector/collect_events.py

      - name: Show generated event feed
        run: |
          echo "----- events.json -----"
          cat events.json

      - name: Commit updated event feed
        run: |
          git config user.name "FAM Event Bot"
          git config user.email "actions@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "No event-feed changes to commit."
          else
            git commit -m "Automatically update public engagement events"
            git push
          fi
